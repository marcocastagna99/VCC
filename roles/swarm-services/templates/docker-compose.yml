services:
  db:
    # TODO[VCC-012]: Configure docker compose for postgres
    image: postgres:16
    environment:
      POSTGRES_USER: "{{ db_user }}"
      POSTGRES_DB: "{{ db_name }}"
      POSTGRES_PASSWORD_FILE: "/run/secrets/db_password"
    volumes:
      - "{{ data_dir }}/pgdata:/var/lib/postgresql/data"
      - "{{ data_dir }}/configs/pgsql:/docker-entrypoint-initdb.d:ro"
    networks:
      net:
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - "{{ data_dir }}/redis:/data"
    networks:
      net:

  forgejo:
    # TODO[VCC-013]: Configure docker compose for forgejo
    image: "{{ registry_address }}/forgejo"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:{{ forgejo_port }}/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      replicas: 2
    environment:
      - DB_TYPE=postgres
      - DB_HOST=db:5432
      - DB_NAME={{ db_name }}
      - DB_USER={{ db_user }}
      - DB_PASSWD_FILE=/run/secrets/db_password
    secrets:
      - db_password
      - forgejo_admin_password
      - forgejo_oauth_secret
      - forgejo_db_password
    volumes:
      - "{{ data_dir }}/forgejo:/data"
      - "{{ data_dir }}/configs/forgejo/forgejo.ini:/conf/app.ini:ro"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - "{{ data_dir }}/certs/wildcard.crt:/usr/local/share/ca-certificates/wildcard.crt:ro"
    networks:
      - net

  authelia:
    # TODO[VCC-014]: Configure docker compose for authelia
    image: "{{ registry_address }}/authelia"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:{{ authelia_port }}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    secrets:
      - jwks_key
      - authelia_db_password
      - forgejo_oauth_secret
    deploy:
      replicas: 2
    environment:
      - AUTHELIA_STORAGE_POSTGRES_ADDRESS=tcp://db:5432
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.authelia.rule=Host(`auth.{{ domain_name }}`)"
        - "traefik.http.routers.authelia.entrypoints=websecure"
        - "traefik.http.services.authelia.loadbalancer.server.port={{ authelia_port }}"
    volumes:
      - "{{ data_dir }}/configs/authelia:/config"
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net

secrets:
  jwks_key:
    file: "{{ data_dir }}/jwks/jwks.key"
  db_password:
    file: "{{ data_dir }}/secrets/db_password.txt"
  forgejo_admin_password:
    file: "{{ data_dir }}/secrets/forgejo_admin_password.txt"
  forgejo_oauth_secret:
    file: "{{ data_dir }}/secrets/forgejo_oauth_secret.txt"
  forgejo_db_password:
    file: "{{ data_dir }}/secrets/db_password.txt"
  authelia_db_password:
      file: "{{ data_dir }}/secrets/authelia_db_password.txt"