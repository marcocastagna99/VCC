---
# TODO[VCC-003]: Implement tasks for NFS server setup
# - name: "Create NFS share directory"
- name: "Create NFS share directory"
  ansible.builtin.file:
    path: "{{ nfs_dir }}"
    state: directory
    mode: '0777'

# - name: Install NFS server
- name: Install NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: yes

# - name: Configure exports
- name: Configure exports
  ansible.builtin.template:
    src: exports
    dest: /etc/exports
  notify: Restart NFS server


# - name: Start NFS server
- name: Start NFS server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    state: started
    enabled: yes

## check exports
- block:
  - name: Apply notifiers
    ansible.builtin.meta: flush_handlers # Flush any pending handlers instead of waiting until the end of the playbook
  - name: Get verbose export list
    ansible.builtin.command: exportfs -v
    register: exportfs_verbose
    changed_when: false
  - name: Assert that the export exists with correct options
    ansible.builtin.assert:
      that:
        - exportfs_verbose.stdout is search(storage_network | regex_escape ~ '\\s*\\(.*rw.*no_root_squash.*\\)') # Ensures the NFS export is correctly configured with read/write and no_root_squash permissions
      fail_msg: "Export for {{ storage_network }} is missing or has incorrect options"
  when: enable_asserts

