services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER={{ db_user }}
      - POSTGRES_PASSWORD={{ db_password }}
      - POSTGRES_DB={{ db_name }}
    volumes:
      - ./configs/pgsql:/docker-entrypoint-initdb.d:ro
    networks:
      - net

  authelia:
    image: authelia
    environment:
      - TZ=Europe/Rome
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authelia.rule=Host(`auth.vcc.local`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls=true"
    volumes:
      - ./configs/authelia:/config
    networks:
      - net
    extra_hosts:
      - "git.vcc.local:192.168.255.11"
      
  forgejo:
      image: forgejo
      environment:
        - TZ=Europe/Rome
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.forgejo.rule=Host(`git.vcc.local`)"
        - "traefik.http.routers.forgejo.entrypoints=websecure"
        - "traefik.http.routers.forgejo.tls=true"
        - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
      volumes:
        - "{{ data_dir }}/forgejo:/data"
        - "{{ data_dir }}/configs/forgejo/forgejo.ini:/conf/app.ini:ro"
        - /etc/timezone:/etc/timezone:ro
        - /etc/localtime:/etc/localtime:ro
        - "{{ data_dir }}/certs/wildcard.crt:/usr/local/share/ca-certificates/wildcard.crt:ro"
      networks:
        - net
      extra_hosts:
        - "auth.vcc.local:192.168.255.11"